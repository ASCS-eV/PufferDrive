name: Installation Test

on:
  pull_request:
    branches: [ main, '3.0', 'integration/3.0' ]
  push:
    branches: [ main, '3.0' ]

jobs:
  # The matrix runs unless this job succeeded and positively reported
  # code=false, so a broken detector costs time rather than coverage.
  changes:
    uses: ./.github/workflows/detect-code-changes.yml

  test:
    name: ${{ matrix.py }} - ${{ matrix.os }}
    needs: changes
    # The matrix must expand even when there is nothing to install: a job-level
    # skip reports one unexpanded check, so the six required contexts would
    # never appear and every documentation-only PR would hang at "Expected".
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        py: ["3.13", "3.12", "3.11"]
        exclude:
          - os: macos-latest
            py: "3.13"
        include:
          - os: ubuntu-latest
            py: "3.14"

    steps:
      # The predicate is written once here, as a step output, rather than
      # repeated on every step below.
      - name: Decide whether to install
        id: gate
        run: echo "skip=${{ needs.changes.result == 'success' && needs.changes.outputs.code == 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Free up disk space (Linux only)
        if: runner.os == 'Linux' && steps.gate.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          sudo rm -rf ~/.cache/pip /tmp/* /var/tmp/*

      - name: Install pufferlib (Linux)
        if: runner.os == 'Linux' && steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install -U pip "setuptools<81" wheel numpy
          # CPU-only torch. The CUDA stack is ~3 GB of wheels and no longer
          # fits the runner's disk quota; see the Install steps in ci.yml.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e . --no-build-isolation

      - name: Install pufferlib (macOS)
        if: runner.os != 'Linux' && steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install -U pip
          # Deliberately a plain install: macOS wheels are already CPU-only, so
          # this keeps the default PEP 517 build-isolation path under test.
          pip install -e .
